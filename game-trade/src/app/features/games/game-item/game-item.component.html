@let gameInfo = game();

<mat-card class="game-card" appearance="outlined">
  <img
    class="game-image"
    [src]="gameInfo.imageUrl"
    [alt]="gameInfo.title"
    [attr.loading]="priority() ? 'eager' : 'lazy'"
  />
  <mat-card-content class="game-details">
    <h2>{{ gameInfo.title }}</h2>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-flat-button color="primary" type="button">Buy now</button>
  </mat-card-actions>
</mat-card>
