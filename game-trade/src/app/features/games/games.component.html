<section class="games" aria-labelledby="games-heading">
  <div class="page-heading">
    <div>
      <p class="eyebrow">GAME STORE</p>
      <h1 id="games-heading">Find your next game</h1>
    </div>
  </div>

  <app-games-search />

  @if (games(); as loadedGames) {
    <div class="games-grid">
      @for (game of loadedGames; track game.id; let first = $first) {
        <app-game-item [game]="game" [priority]="first" />
      }
    </div>
  }
</section>
